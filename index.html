<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>For Teju ♡</title>
<style>
:root{--cream:#f7f0e5;--burgundy:#6b263d;--ink:#3b302c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,serif;overflow:hidden}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #dfd2c3}.brand{font-size:17px;color:var(--burgundy);letter-spacing:.06em}.counter{font:12px Arial;color:#75675e}
main{height:calc(100dvh - 112px);display:flex;align-items:center;justify-content:center;padding:10px}.stage{width:min(100%,1200px);height:100%;display:flex;align-items:center;justify-content:center;position:relative}
video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#21191a;box-shadow:0 12px 38px #50352a24}
footer{height:54px;display:flex;align-items:center;justify-content:center;gap:14px}button{border:1px solid #bda99a;background:#fffaf3;color:var(--burgundy);border-radius:30px;padding:9px 18px;font:14px Arial}button:disabled{opacity:.35}
.progress{height:3px;background:#e3d8ca}.bar{height:3px;background:var(--burgundy);width:0;transition:width .2s}
.hint{position:absolute;bottom:8px;text-align:center;color:#806f62;font:11px Arial;pointer-events:none}
.overlay{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:5}.overlay h1{font-size:clamp(38px,8vw,72px);font-weight:normal;color:var(--burgundy);margin:10px}.overlay p{font-size:17px;line-height:1.6;max-width:440px}.start{background:var(--burgundy);color:white;border:0;padding:13px 28px;margin-top:16px}
@media(max-width:600px){header{height:50px}.brand{font-size:15px}main{height:calc(100dvh - 104px);padding:5px}video{width:100%;height:auto;max-height:100%;object-fit:contain}footer{height:54px;gap:8px}button{padding:8px 13px}}

/* Keep the scrapbook in a wide, landscape presentation layout */
.app{width:100vw;height:100dvh;display:flex;flex-direction:column}
main{min-height:0;flex:1}
.stage{aspect-ratio:16/9;width:min(100%,calc((100dvh - 112px)*16/9));height:auto;max-height:100%;margin:auto}
video{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
@media(orientation:portrait) and (max-width:900px){
 .app{position:fixed;top:0;left:0;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
 main{height:calc(100vw - 104px);flex:1;padding:4px}
 .stage{width:min(100%,calc((100dvh - 104px)*16/9));height:100%;aspect-ratio:16/9}
 header{height:50px;flex-shrink:0}footer{height:54px;flex-shrink:0}
}
</style></head><body>
<div class="overlay" id="welcome"><div style="font-size:30px;color:#687b62">✿</div><h1>For Teju</h1><p>A little scrapbook of our favourite human, our best days, and all the madness in between.</p><button class="start" onclick="begin()">Open your scrapbook ♡</button></div>
<div class="app" id="app"><header><div class="brand">♡ TEJU-VERSE</div><div class="counter" id="counter">01 / 15</div></header><div class="progress"><div class="bar" id="bar"></div></div>
<main id="main"><div class="stage"><video id="clip" playsinline preload="auto"></video><div class="hint">Swipe to turn the page · the animation pauses at the end</div></div></main>
<footer><button id="back" onclick="prev()">← Back</button><button id="next" onclick="next()">Next →</button></footer></div>
<script>
const total=15;let page=1,started=false;const v=document.getElementById('clip');
function src(){return `clips/slide-${String(page).padStart(2,'0')}.mp4`}
function show(){v.pause();v.src=src();v.currentTime=0;v.load();document.getElementById('counter').textContent=`${String(page).padStart(2,'0')} / ${total}`;document.getElementById('bar').style.width=(page/total*100)+'%';document.getElementById('back').disabled=page===1;document.getElementById('next').textContent=page===total?'Replay ↻':'Next →';if(started){const p=v.play();if(p)p.catch(()=>{})}}
function begin(){started=true;document.getElementById('welcome').style.display='none';show()}
function next(){if(page<total)page++;else page=1;show()}
function prev(){if(page>1){page--;show()}}
v.addEventListener('ended',()=>{v.pause();try{v.currentTime=Math.max(0,v.duration-.04)}catch(e){}})
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
let sx=0,sy=0;document.getElementById('main').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
document.getElementById('main').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}},{passive:true});
show();
</script></body></html>
